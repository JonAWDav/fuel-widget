name: macOS checks

on:
  push:
  pull_request:

jobs:
  macos:
    strategy:
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install without login startup
        run: bash setup.sh --no-startup
      - name: Unit tests
        run: .venv/bin/python -m unittest discover
      - name: Offscreen widget
        run: .venv/bin/python check_ui.py --demo
      - name: Prepare and validate launch agent
        run: bash install-macos.sh --prepare-only
      - name: Test installer skill download
        run: bash skills/install-fuel-widget/scripts/install-fuel.sh "$RUNNER_TEMP/fuel-installer-smoke" --download-only
